apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web3team
resources:
  - ../../base
  - issuer.yaml
  - middleware.yaml
  - ingress.yaml
images:
  - name: frontend-image
    newName: 255229736336.dkr.ecr.ap-southeast-2.amazonaws.com/connect5ive/frontend
    newTag: b68ba44373e0bf7d1281500779c115ac54bf97b2
  - name: backend-image
    newName: 255229736336.dkr.ecr.ap-southeast-2.amazonaws.com/connect5ive/backend
    newTag: bootstrap-20261011-074753
configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
