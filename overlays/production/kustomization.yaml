  - ingress.yaml
images:
  - name: frontend-image
    newName: 255229736336.dkr.ecr.ap-southeast-2.amazonaws.com/connect5ive/frontend
    newTag: bootstrap-20261011-074753
  - name: backend-image
    newName: 255229736336.dkr.ecr.ap-southeast-2.amazonaws.com/connect5ive/backend
    newTag: bootstrap-20261011-074753
configMapGenerator:
