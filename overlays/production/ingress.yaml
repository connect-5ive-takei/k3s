apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web3team
  annotations:
    cert-manager.io/issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: web3team-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - __PUBLIC_HOST__
      secretName: web3team-tls
  rules:
    - host: __PUBLIC_HOST__
      http:
        paths:
          # /api は削除せず Laravel に渡す。Next.js の API Route と競合させない。
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
