apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web3team
  annotations:
    # 独自ドメイン取得までは、k3s 標準の Traefik で HTTP を受け付ける。
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # /api は削除せず Laravel に渡す。Next.js の API Route と競合させない。
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
