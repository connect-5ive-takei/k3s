AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Connect5ive deployment artifacts — retains versioned Lambda packages so application
  releases remain reproducible without a permanent build server

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: CloudFormation package -> private versioned S3 bucket
    must:
      - Bucket stays private & TLS-only

Resources:
  DeploymentArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: stores packaged Lambda source; retained for rollback; lifecycle limits old-version cost
        must:
          - block all public access
          - keep versioning enabled for rollback
        mutable: change-with-constraints
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  DeploymentArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: rejects unencrypted transport to deployment artifacts
        must:
          - keep aws:SecureTransport deny
    Properties:
      Bucket: !Ref DeploymentArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DeploymentArtifactsBucket.Arn
              - !Sub "${DeploymentArtifactsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  DeploymentArtifactsBucketName:
    Description: Private bucket used by aws cloudformation package
    Value: !Ref DeploymentArtifactsBucket

