name: Deploy legacy k3s manually

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to roll back, or infrastructure for the current manifest
        required: true
        default: infrastructure
        type: choice
        options:
          - infrastructure
          - backend
          - frontend
      image_tag:
        description: Existing immutable ECR tag; required for backend/frontend
        required: false
        type: string

concurrency:
  group: production-legacy-k3s
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply legacy manifests through AWS Systems Manager
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://${{ vars.PUBLIC_HOST }}
    permissions:
      contents: write
      id-token: write

    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      K3S_INSTANCE_ID: ${{ vars.K3S_INSTANCE_ID }}
      PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
      COMPONENT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.component || inputs.component || 'infrastructure' }}
      IMAGE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.image_tag || inputs.image_tag || '' }}
      SOURCE_REPOSITORY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_repository || '' }}
      SOURCE_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_sha || '' }}

    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Validate event and configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          for name in AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN AWS_REGION K3S_INSTANCE_ID PUBLIC_HOST; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production configuration: ${name}" >&2
              exit 1
            fi
          done

          if [[ ! "$K3S_INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]]; then
            echo "K3S_INSTANCE_ID is invalid." >&2
            exit 1
          fi

          case "$COMPONENT" in
            infrastructure)
              if [[ -n "$IMAGE_TAG" ]]; then
                echo "image_tag must be empty for infrastructure deployments." >&2
                exit 1
              fi
              ;;
            backend|frontend)
              if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40,64}$ ]]; then
                echo "IMAGE_TAG must be an immutable commit SHA." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported component: ${COMPONENT}" >&2
              exit 1
              ;;
          esac

          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            expected_repository="${GITHUB_REPOSITORY_OWNER}/${COMPONENT}"
            if [[ "$SOURCE_REPOSITORY" != "$expected_repository" ]] || [[ "$SOURCE_SHA" != "$IMAGE_TAG" ]]; then
              echo "Rejected deployment request from an unexpected repository or revision." >&2
              exit 1
            fi
          fi

      - name: Record immutable image tag
        if: env.COMPONENT != 'infrastructure'
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/update-image-tag.sh "$COMPONENT" "$IMAGE_TAG"

          if git diff --quiet -- overlays/production/kustomization.yaml; then
            echo "The requested image tag is already recorded."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlays/production/kustomization.yaml
          git commit -m "chore: ${COMPONENT}イメージを${IMAGE_TAG}へ更新 [skip ci]"
          git push origin HEAD:main

      - name: Render production manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/render-production.sh > "${RUNNER_TEMP}/production.yaml"

          if ! grep -q "host: ${PUBLIC_HOST}" "${RUNNER_TEMP}/production.yaml"; then
            echo "Rendered Ingress does not contain PUBLIC_HOST." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: k3s-${{ github.run_id }}

      - name: Verify that the k3s instance is online in Systems Manager
        shell: bash
        run: |
          set -Eeuo pipefail
          ping_status="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${K3S_INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"

          if [[ "$ping_status" != "Online" ]]; then
            echo "EC2 ${K3S_INSTANCE_ID} is not Online in Systems Manager (status: ${ping_status})." >&2
            echo "Start the instance and verify its SSM instance profile, then rerun this workflow." >&2
            exit 1
          fi

      - name: Apply to k3s
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail

          namespace_payload="$(gzip -9c bootstrap/namespace.yaml | base64 | tr -d '\n')"
          cert_manager_payload="$(gzip -9c bootstrap/cert-manager.yaml | base64 | tr -d '\n')"
          production_payload="$(gzip -9c "${RUNNER_TEMP}/production.yaml" | base64 | tr -d '\n')"
          deploy_script_payload="$(gzip -9c scripts/remote-deploy.sh | base64 | tr -d '\n')"
          registry="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          parameters="$(jq -n \
            --arg namespace "$namespace_payload" \
            --arg cert_manager "$cert_manager_payload" \
            --arg production "$production_payload" \
            --arg deploy_script "$deploy_script_payload" \
            --arg region "$AWS_REGION" \
            --arg registry "$registry" \
            '{commands: [
              "set -eu",
              "work_dir=/tmp/connect5ive-deploy",
              "sudo install -d -m 700 \"$work_dir\"",
              ("printf %s " + ($namespace | @sh) + " | base64 --decode | gunzip | sudo tee \"$work_dir/namespace.yaml\" >/dev/null"),
              ("printf %s " + ($cert_manager | @sh) + " | base64 --decode | gunzip | sudo tee \"$work_dir/cert-manager.yaml\" >/dev/null"),
              ("printf %s " + ($production | @sh) + " | base64 --decode | gunzip | sudo tee \"$work_dir/production.yaml\" >/dev/null"),
              ("printf %s " + ($deploy_script | @sh) + " | base64 --decode | gunzip | sudo tee \"$work_dir/remote-deploy.sh\" >/dev/null"),
              "sudo chmod 700 \"$work_dir/remote-deploy.sh\"",
              ("sudo bash \"$work_dir/remote-deploy.sh\" " + ($region | @sh) + " " + ($registry | @sh) + " \"$work_dir\"")
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$K3S_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Connect5ive deployment ${GITHUB_SHA}" \
            --timeout-seconds 900 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${command_id}" >> "$GITHUB_OUTPUT"

          status="Pending"
          for attempt in $(seq 1 90); do
            invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$K3S_INSTANCE_ID" \
              --output json 2>/dev/null || true)"
            status="$(jq -r '.Status // "Pending"' <<<"$invocation")"

            case "$status" in
              Success|Cancelled|Failed|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          invocation="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$K3S_INSTANCE_ID" \
            --output json)"
          jq -r '.StandardOutputContent' <<<"$invocation"
          jq -r '.StandardErrorContent' <<<"$invocation" >&2

          if [[ "$(jq -r '.Status' <<<"$invocation")" != "Success" ]]; then
            echo "SSM deployment failed with status $(jq -r '.Status' <<<"$invocation")." >&2
            exit 1
          fi

      - name: Verify HTTPS endpoints
        shell: bash
        run: |
          set -Eeuo pipefail

          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 6 \
            --connect-timeout 10 --max-time 30 \
            "https://${PUBLIC_HOST}/healthz" >/dev/null

          api_status="$(curl --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 10 --max-time 30 \
            --header "Accept: application/json" \
            --output /dev/null --write-out '%{http_code}' \
            "https://${PUBLIC_HOST}/api/user")"

          if [[ "$api_status" != "401" ]]; then
            echo "Expected unauthenticated /api/user to return 401, got ${api_status}." >&2
            exit 1
          fi
